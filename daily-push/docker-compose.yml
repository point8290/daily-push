version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: daily-push-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_push_v2
      POSTGRES_USER: daily_push_user
      POSTGRES_PASSWORD: daily_push_pass
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daily_push_user -d daily_push_v2']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: daily-push-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: daily_push_v2
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
