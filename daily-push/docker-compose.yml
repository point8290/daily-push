version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: daily-push-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: daily_push
      MYSQL_USER: daily_push_user
      MYSQL_PASSWORD: daily_push_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
