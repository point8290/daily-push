<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background:var(--bg-app); font-family: var(--font-body); }
  .wrap { padding: 16px; }
  .nav { background: var(--slate-900); color:#fff; border-radius: 12px; padding: 12px 20px; display:flex; align-items:center; gap: 24px; }
  .brand { display:flex; align-items:center; gap:8px; font-family: var(--font-display); font-weight: 800; font-size: 16px; }
  .brand svg { width:24px; height:24px; }
  .item { font-size: 13px; font-weight: 500; color: var(--slate-300); }
  .item.active { color: var(--sky-400); }
  .spacer { flex:1; }
  .user { font-size: 12px; color: var(--slate-400); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#0ea5e9"/>
        <path d="M11 22.5 L20 14 L29 22.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 29 L20 20.5 L29 29" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
      </svg>
      Daily Push
    </div>
    <span class="item active">Today</span>
    <span class="item">Map</span>
    <span class="item">Goals</span>
    <span class="item">History</span>
    <span class="item">Settings</span>
    <span class="spacer"></span>
    <span class="user">Amit Singh</span>
    <span class="item">Sign out</span>
  </nav>
</div>
</body>
</html>
