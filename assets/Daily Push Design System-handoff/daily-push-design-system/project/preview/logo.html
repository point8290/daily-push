<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background:#fff; }
  .card { padding: 24px; display:flex; align-items:center; gap:20px; }
  .logo-tile { width: 72px; height: 72px; flex-shrink: 0; }
  .wordmark { height: 36px; }
  .col { display:flex; flex-direction:column; gap:4px; }
  .label { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .name { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--fg-1); letter-spacing: -0.02em; }
  .tag { font-size: 13px; color: var(--fg-2); }
</style>
</head>
<body>
<div class="card">
  <img class="logo-tile" src="../assets/logo-mark.svg" alt="Daily Push mark">
  <div class="col">
    <span class="label">Primary logo</span>
    <span class="name">Daily Push</span>
    <span class="tag">Rounded tile · stacked chevrons · sky 600</span>
  </div>
</div>
</body>
</html>
