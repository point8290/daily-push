<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background:#fff; font-family: var(--font-body); }
  .wrap { padding: 18px; display:grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
  .sw { aspect-ratio: 1.2 / 1; padding: 10px 12px; display:flex; flex-direction:column; justify-content:space-between; }
  .name { font-size: 11px; font-weight: 600; font-family: var(--font-mono); }
  .hex  { font-size: 11px; font-family: var(--font-mono); opacity: .8; }
  .df { color: var(--slate-800); }
  .lf { color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sw df" style="background:var(--slate-50)"><span class="name">slate/50</span><span class="hex">#f8fafc</span></div>
  <div class="sw df" style="background:var(--slate-100)"><span class="name">slate/100</span><span class="hex">#f1f5f9</span></div>
  <div class="sw df" style="background:var(--slate-200)"><span class="name">slate/200</span><span class="hex">#e2e8f0</span></div>
  <div class="sw df" style="background:var(--slate-300)"><span class="name">slate/300</span><span class="hex">#cbd5e1</span></div>
  <div class="sw df" style="background:var(--slate-400)"><span class="name">slate/400</span><span class="hex">#94a3b8</span></div>
  <div class="sw lf" style="background:var(--slate-500)"><span class="name">slate/500</span><span class="hex">#64748b</span></div>
  <div class="sw lf" style="background:var(--slate-600)"><span class="name">slate/600</span><span class="hex">#475569</span></div>
  <div class="sw lf" style="background:var(--slate-700)"><span class="name">slate/700</span><span class="hex">#334155</span></div>
  <div class="sw lf" style="background:var(--slate-800)"><span class="name">slate/800</span><span class="hex">#1e293b</span></div>
  <div class="sw lf" style="background:var(--slate-900)"><span class="name">slate/900 ★</span><span class="hex">#0f172a</span></div>
</div>
</body>
</html>
