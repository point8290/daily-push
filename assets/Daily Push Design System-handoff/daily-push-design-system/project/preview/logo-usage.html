<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background:#fff; }
  .wrap { padding: 20px; display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border-radius: 14px; padding: 20px; display:flex; align-items:center; gap:14px; }
  .tile.light { background: #fff; border: 1px solid var(--border-base); }
  .tile.dark { background: var(--slate-900); }
  .tile.sky { background: var(--sky-50); border: 1px solid var(--sky-200); }
  .tile.amber { background: var(--amber-50); border: 1px solid var(--amber-200); }
  .mini { width: 40px; height: 40px; flex-shrink:0; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--fg-3); text-transform: uppercase; letter-spacing: .1em; }
  .lbl.on-dark { color: var(--slate-300); }
  .name { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--fg-1); letter-spacing: -0.02em; }
  .name.on-dark { color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tile light">
    <img class="mini" src="../assets/logo-mark.svg">
    <div><div class="lbl">On light</div><div class="name">Daily Push</div></div>
  </div>
  <div class="tile dark">
    <img class="mini" src="../assets/logo-mark.svg">
    <div><div class="lbl on-dark">On dark</div><div class="name on-dark">Daily Push</div></div>
  </div>
  <div class="tile sky">
    <img class="mini" src="../assets/logo-mark.svg">
    <div><div class="lbl">On brand tint</div><div class="name">Daily Push</div></div>
  </div>
  <div class="tile amber">
    <img class="mini" src="../assets/logo-mark.svg">
    <div><div class="lbl">On warm tint</div><div class="name">Daily Push</div></div>
  </div>
</div>
</body>
</html>
