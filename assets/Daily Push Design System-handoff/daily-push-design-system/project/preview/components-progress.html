<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background:#fff; font-family: var(--font-body); }
  .wrap { padding: 20px; display:flex; flex-direction:column; gap: 14px; }
  .heat { display:flex; gap: 3px; }
  .day { width: 14px; height: 14px; border-radius: 3px; }
  .l0 { background: var(--slate-100); }
  .l1 { background: var(--sky-200); }
  .l2 { background: var(--sky-400); }
  .l3 { background: var(--sky-500); }
  .l4 { background: var(--sky-700); }
  .legend { display:flex; align-items:center; gap:6px; font-size: 11px; color: var(--fg-3); }
  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background:#fff; border: 1px solid var(--border-base); border-radius: 12px; padding: 12px; text-align:center; }
  .big { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
  .stat .big { color: var(--sky-600); }
  .stat:nth-child(2) .big { color: var(--slate-800); }
  .stat:nth-child(3) .big { color: var(--slate-800); }
  .sm { font-size: 11px; color: var(--fg-2); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="big">12</div><div class="sm">Day streak</div></div>
    <div class="stat"><div class="big">48</div><div class="sm">Sessions</div></div>
    <div class="stat"><div class="big">24h</div><div class="sm">Time studied</div></div>
  </div>
  <div class="heat">
    <!-- 40 dots, random-ish pattern -->
    <div class="day l1"></div><div class="day l0"></div><div class="day l2"></div><div class="day l3"></div><div class="day l2"></div><div class="day l0"></div><div class="day l1"></div><div class="day l4"></div>
    <div class="day l3"></div><div class="day l2"></div><div class="day l0"></div><div class="day l1"></div><div class="day l3"></div><div class="day l4"></div><div class="day l2"></div><div class="day l3"></div>
    <div class="day l0"></div><div class="day l2"></div><div class="day l3"></div><div class="day l4"></div><div class="day l3"></div><div class="day l2"></div><div class="day l1"></div><div class="day l3"></div>
    <div class="day l4"></div><div class="day l3"></div><div class="day l2"></div><div class="day l0"></div><div class="day l2"></div><div class="day l3"></div><div class="day l4"></div><div class="day l3"></div>
    <div class="day l2"></div><div class="day l1"></div><div class="day l3"></div><div class="day l4"></div><div class="day l3"></div><div class="day l2"></div><div class="day l3"></div><div class="day l4"></div>
  </div>
  <div class="legend">Less <div class="day l0"></div><div class="day l1"></div><div class="day l2"></div><div class="day l3"></div><div class="day l4"></div> More</div>
</div>
</body>
</html>
