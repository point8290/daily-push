# ─── dev overlay ──────────────────────────────────────────────────────────────
# Infra only — API and workers run locally via `make dev-api` / `make dev-workers`.
# Ports are exposed on localhost so local npm scripts can connect.
#
# Usage: make dev-infra-up
#   (internally: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d)

services:
  postgres:
    container_name: te-postgres-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB:                ${POSTGRES_DB}
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD:  md5
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  redis:
    container_name: te-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data

volumes:
  pgdata-dev:
  redisdata-dev:
